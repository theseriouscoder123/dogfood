# One command to a seeded portal:   docker compose up
# Local development (hot reload):   docker compose up -d db mail   then run api + web with npm run dev
name: dogfood

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    # Catches every outgoing email offline; open http://localhost:8025 to read invites.
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://dogfood:dogfood@db:5432/dogfood
      FIXTURES_PATH: /app/data/fixtures.json
      SEED_DEMO: "true"
      SMTP_URL: smtp://mail:1025
      PUBLIC_BASE_URL: http://localhost:8080
      UPLOAD_DIR: /data/uploads
      # Ed25519 key that signs records and certificates. Its own volume: back it up, never share it.
      SIGNING_KEY_PATH: /data/keys/signing-key.pem
      # Webhooks may not reach private addresses (SSRF guard), except the demo receiver below.
      WEBHOOK_ALLOW_PRIVATE_HOSTS: hooks
    volumes:
      - uploads:/data/uploads
      - keys:/data/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  hooks:
    # Demo webhook receiver: verifies signatures and lists what arrived at http://localhost:9000.
    # It runs from the API image; delete this service (and WEBHOOK_ALLOW_PRIVATE_HOSTS) for a real event.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/scripts/webhook-receiver.js"]
    environment:
      WEBHOOK_SECRET: whsec_ZGVtby1vbmx5LXdlYmhvb2stc2VjcmV0IQ==
    ports:
      - "127.0.0.1:9000:9000"

  web:
    build:
      context: apps/web
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  uploads:
  keys:
