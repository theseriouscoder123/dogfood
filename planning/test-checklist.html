<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dogfood test checklist</title>
<style>
  :root { --bg:#f5f6fa; --surface:#fff; --ink:#12152b; --muted:#646a85; --line:#e3e6ef; --primary:#3346f0; --soft:#eef0ff;
          --pass:#12805c; --pass-soft:#e3f6ee; --fail:#c62a2a; --fail-soft:#fdeaea; --skip:#8a6d00; --skip-soft:#fff5d6; --block:#6b4bd6; --block-soft:#efeafe; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0d1a; --surface:#12162b; --ink:#e8eaf6; --muted:#9aa0bd; --line:#252a45; --primary:#7c89ff; --soft:#1c2146;
            --pass:#4fd1a1; --pass-soft:#123326; --fail:#ff7b7b; --fail-soft:#3a1717; --skip:#f0c75e; --skip-soft:#3a300f; --block:#b39dff; --block-soft:#261d45; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line); padding:14px 20px; }
  .wrap { max-width:1100px; margin:0 auto; }
  h1 { margin:0; font-size:20px; }
  .bar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; display:flex; margin:10px 0 8px; }
  .bar span { display:block; height:100%; }
  .counts { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .counts b { color:var(--ink); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .chip, button.act { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; padding:5px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  input.search { flex:1; min-width:160px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:10px; padding:6px 10px; font:inherit; }
  main { padding:16px 20px 80px; }
  h2 { font-size:17px; margin:26px 0 6px; }
  details { background:var(--surface); border:1px solid var(--line); border-radius:14px; margin:10px 0; }
  summary { cursor:pointer; padding:10px 14px; font-weight:700; display:flex; gap:10px; align-items:center; }
  summary .mini { margin-left:auto; font-size:12px; color:var(--muted); font-weight:600; }
  .case { display:grid; grid-template-columns: 74px 1fr; gap:4px 12px; padding:10px 14px; border-top:1px solid var(--line); }
  .case.pass { background:var(--pass-soft); } .case.fail { background:var(--fail-soft); } .case.skip { background:var(--skip-soft); } .case.blocked { background:var(--block-soft); }
  .id { font-weight:800; font-size:13px; padding-top:2px; }
  .id .star { color:var(--primary); }
  .text code { background:var(--soft); padding:0 4px; border-radius:4px; font-size:13px; }
  .text a { color:var(--primary); }
  .update { margin-top:4px; font-size:13px; color:var(--skip); }
  .controls { grid-column:2; display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:4px; }
  .st { border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:8px; padding:3px 10px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .st[data-s="pass"][aria-pressed="true"] { background:var(--pass); border-color:var(--pass); color:#fff; }
  .st[data-s="fail"][aria-pressed="true"] { background:var(--fail); border-color:var(--fail); color:#fff; }
  .st[data-s="skip"][aria-pressed="true"] { background:var(--skip); border-color:var(--skip); color:#fff; }
  .st[data-s="blocked"][aria-pressed="true"] { background:var(--block); border-color:var(--block); color:#fff; }
  input.note { flex:1; min-width:180px; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:4px 8px; font:inherit; font-size:13px; }
  .stamp { font-size:11.5px; color:var(--muted); }
  .hidden { display:none !important; }
  @media (max-width:600px) { .case { grid-template-columns:1fr; } .controls { grid-column:1; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Dogfood test checklist</h1>
    <div class="bar" id="bar"></div>
    <div class="counts" id="counts"></div>
    <div class="tools">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="priority" aria-pressed="false">★ Priority</button>
      <button class="chip" data-f="todo" aria-pressed="false">Not run</button>
      <button class="chip" data-f="fail" aria-pressed="false">Failed</button>
      <input class="search" id="q" placeholder="Search cases (id or text)">
      <button class="act" id="exportMd">Export report (.md)</button>
      <button class="act" id="exportJson">Export (.json)</button>
      <button class="act" id="importJson">Import</button>
      <button class="act" id="reset">Reset</button>
    </div>
  </div>
</header>
<main class="wrap" id="root"></main>
<script>
const GROUPS = [{"title": "Plan 1: T1 + T2", "sections": [{"name": "3. Smoke test (15 min)", "cases": [{"id": "S-1", "html": "<a href=\"http://localhost:8080\" target=\"_blank\">http://localhost:8080</a> loads. Three event cards, with no console errors (DevTools).", "note": "", "p": true}, {"id": "S-2", "html": "Sample Hack 2026 → Projects tab shows 40 projects. &quot;Glass Signal&quot; (prj_01) is present; prj_41 (the duplicate) is <b>not</b>.", "note": "", "p": true}, {"id": "S-3", "html": "Log in as organizer → Manage → every sidebar page opens without an error. The pages are Dashboard, Details, Schedule, Tracks, Prizes, Submission form, Organizers, Rubric, Judges, Assignments, Progress, Integrity, Results and Exports.", "note": "", "p": true}, {"id": "S-4", "html": "Sample Hack → Results tab (public, logged out) shows a podium and 40 ranked projects.", "note": "", "p": true}, {"id": "S-5", "html": "Log in as <code>judge@dogfood.local</code> → Spring Build Sprint → Judging. The queue shows 3 of 7 submitted. Open a &quot;To review&quot; project, press <code>7</code>, wait for &quot;Saved&quot;, then reload: the score is still there.", "note": "", "p": true}, {"id": "S-6", "html": "Toggle the theme (monitor icon, top right): light and dark both look right with no unreadable text. Reload: the choice sticks.", "note": "", "p": true}, {"id": "S-7", "html": "Mailpit is reachable at <a href=\"http://localhost:8025.\" target=\"_blank\">http://localhost:8025.</a>", "note": "", "p": true}]}, {"name": "4. T1: participant portal › 4.1 Accounts and sessions", "cases": [{"id": "AU-1", "html": "Register a new account with a password of 7 characters. <b>Expected:</b> refused, with a readable message (minimum 8).", "note": "", "p": false}, {"id": "AU-2", "html": "Register with a valid email and an 8+ character password. <b>Expected:</b> logged in; the avatar menu shows your name.", "note": "", "p": true}, {"id": "AU-3", "html": "Register again with the same email in a different case (<code>Me@X.com</code> vs <code>me@x.com</code>). <b>Expected:</b> &quot;An account with this email already exists.&quot;", "note": "", "p": false}, {"id": "AU-4", "html": "Log out, then log in with a wrong password, then with an unknown email. <b>Expected:</b> the *same* generic error both times (no account enumeration).", "note": "", "p": true}, {"id": "AU-5", "html": "&quot;Forgot password&quot; for your email. <b>Expected:</b> an email in Mailpit with a reset link. Set a new password and you&#x27;re logged in. <b>Using the same link again fails</b> (single use), and the old password no longer works.", "note": "", "p": true}, {"id": "AU-6", "html": "Forgot password for an unknown email. <b>Expected:</b> the same &quot;check your inbox&quot; message and no email.", "note": "", "p": false}, {"id": "AU-7", "html": "Visit <code>/events/dogfood-demo-jam/team</code> logged out. <b>Expected:</b> you&#x27;re sent to login, and back to the team page afterwards.", "note": "", "p": false}]}, {"name": "4. T1: participant portal › 4.2 Browsing (logged out)", "cases": [{"id": "BR-1", "html": "Home page: cards show banner or cover, status pill (Open / Judging / Ended), prize total and participant count.", "note": "", "p": false}, {"id": "BR-2", "html": "Event page tabs: Overview (Markdown renders headings and lists), Prizes, Rules, Projects. The <b>Results</b> tab shows <b>only</b> on Sample Hack (published).", "note": "", "p": true}, {"id": "BR-3", "html": "The countdown on the demo jam ticks every second. The schedule timeline ticks off past dates.", "note": "", "p": false}, {"id": "BR-4", "html": "Gallery: track filter chips and search both narrow the list; an empty search shows an empty state, not an error.", "note": "", "p": true}, {"id": "BR-5", "html": "A project page shows the story, &quot;Built with&quot; tags, repo/demo links and the team. <b>Private</b> answers to organizer questions are <b>not</b> shown when logged out or logged in as another participant.", "note": "", "p": false}, {"id": "BR-6", "html": "<code>/events/does-not-exist</code> and <code>/events/sample-hack-2026/projects/&lt;random-uuid&gt;</code> show the 404 page, not a crash.", "note": "", "p": true}]}, {"name": "4. T1: participant portal › 4.3 Registration and teams (demo jam)", "cases": [{"id": "TM-1", "html": "Logged in as a new user: Demo Jam → &quot;Register&quot; → you become a participant, and the sidebar button changes to &quot;Find or create a team&quot;.", "note": "", "p": true}, {"id": "TM-2", "html": "Create a team. <b>Expected:</b> you&#x27;re the captain, and an invite link is shown.", "note": "", "p": true}, {"id": "TM-3", "html": "Open the invite link in a private window as a *second* new user → join. <b>Expected:</b> both members listed.", "note": "", "p": false}, {"id": "TM-4", "html": "Invite by email → the email is in Mailpit → the link lets the recipient join.", "note": "", "p": false}, {"id": "TM-5", "html": "Fill the team to the event&#x27;s max size (4), then try a 5th join. <b>Expected:</b> &quot;team full&quot;.", "note": "", "p": false}, {"id": "TM-6", "html": "A member of team A opens team B&#x27;s invite link. <b>Expected:</b> refused (one team per person per event). Reopening *your own* team&#x27;s link just says you&#x27;re already a member.", "note": "", "p": false}, {"id": "TM-7", "html": "Revoke an invite link, then open it. <b>Expected:</b> invalid/expired.", "note": "", "p": false}, {"id": "TM-8", "html": "Duplicate team names across different teams are allowed (the fixture has 3), and the gallery still distinguishes them.", "note": "", "p": false}]}, {"name": "4. T1: participant portal › 4.4 Submissions (demo jam)", "cases": [{"id": "SB-1", "html": "Start a project. The editor&#x27;s checklist shows which required fields are missing: title, tagline, description, repo, track, and required custom questions.", "note": "", "p": false}, {"id": "SB-2", "html": "Save a draft with half the fields. <b>Expected:</b> saved and <b>not</b> in the public gallery.", "note": "", "p": true}, {"id": "SB-3", "html": "Submit with a required field missing. <b>Expected:</b> refused, and the missing fields are named.", "note": "", "p": true}, {"id": "SB-4", "html": "Complete everything and submit → the project appears in the gallery. Editing is still allowed; blanking a required field on a submitted project is refused.", "note": "", "p": true}, {"id": "SB-5", "html": "Upload a thumbnail PNG/JPEG. <b>Expected:</b> shown. Upload a <code>.svg</code>, a <code>.txt</code> renamed to <code>.png</code>, and a file over 5 MB. <b>Expected:</b> all three refused.", "note": "", "p": false}, {"id": "SB-6", "html": "Answer the custom questions (single select, long text, checkbox). The private checkbox answer is visible to you and to the organizer, <b>not</b> to the public (see BR-5).", "note": "", "p": false}, {"id": "SB-7", "html": "Unsubmit (back to draft), then withdraw. <b>Expected:</b> the project disappears from the gallery each time. A withdrawn project can be restored while submissions are open.", "note": "", "p": false}, {"id": "SB-8", "html": "<b>Deadline enforcement:</b> as an organizer, move the demo jam&#x27;s submission close to 1 minute from now; wait for it to pass. As the participant, try to edit and to submit. <b>Expected:</b> both refused (server clock, not the UI). Organizer → audit.csv shows <code>submission.refused_closed</code> rows. *(Put the date back afterwards.)*", "note": "Updated: status changes (unsubmit/withdraw) after the deadline are refused and audited too.", "p": false}, {"id": "SB-9", "html": "Sample Hack (closed) as <code>priya1@example.org</code>: the project can&#x27;t be edited; the API returns 403/409 (checker T1-3).", "note": "", "p": true}]}, {"name": "4. T1: participant portal › 4.5 Organizer: event setup", "cases": [{"id": "OR-1", "html": "Details and branding: upload a banner and a logo → they appear on the event page, home card and manage sidebar.", "note": "", "p": false}, {"id": "OR-2", "html": "Edit the overview and rules (Markdown) → the public page renders them.", "note": "", "p": false}, {"id": "OR-3", "html": "Schedule: put the submission close *before* the open time. <b>Expected:</b> refused with a clear message. Valid changes update the countdown and timeline.", "note": "", "p": false}, {"id": "OR-4", "html": "Tracks: add, rename, delete. Prizes: add an overall prize and a track prize, then edit a value → the prize total on the card updates.", "note": "", "p": false}, {"id": "OR-5", "html": "Submission form: add one question of each type, reorder, mark one private and one required → the project editor reflects this immediately.", "note": "", "p": false}, {"id": "OR-6", "html": "Organizers: add a co-organizer by email → they can open Manage. Non-organizers get 403 or a redirect on every <code>/manage/*</code> URL.", "note": "", "p": false}, {"id": "OR-7", "html": "As <b>admin</b>: create a new event via &quot;Create event&quot;. As a regular user: the create page is refused (only admins create events).", "note": "Updated: any signed-in user can now host (the event starts as a private draft). HOSTING=admins restores admin-only.", "p": false}, {"id": "OR-8", "html": "Dashboard: the setup checklist ticks items off as you complete them.", "note": "", "p": false}]}, {"name": "5. T2: judging engine › 5.1 Rubric (Manage → Rubric)", "cases": [{"id": "RB-1", "html": "Demo jam (no scores yet): add, edit, reorder and delete criteria; set a 1–10 range on one. The weight sliders show each criterion&#x27;s share.", "note": "", "p": false}, {"id": "RB-2", "html": "Sample Hack (378 scores exist): the page shows &quot;locked&quot;. Try to change a score range or delete a criterion → refused (<code>rubric_locked</code>). <b>Changing a weight or label works</b>, and audit.csv has <code>rubric.weights_changed</code>.", "note": "", "p": false}, {"id": "RB-3", "html": "After RB-2, Results → the preview ranking changes (weights apply at compute time), and a *saved* run is now marked <b>stale</b>.", "note": "", "p": false}]}, {"name": "5. T2: judging engine › 5.2 Judges and conflicts (Manage → Judges)", "cases": [{"id": "JG-1", "html": "Invite a brand-new email as a judge with one track. <b>Expected:</b> a &quot;Set up my account&quot; email in Mailpit; the link sets a password and logs in as a judge.", "note": "", "p": false}, {"id": "JG-2", "html": "Invite someone who is a <b>participant</b> in the same event. <b>Expected:</b> refused (<code>judge_conflict</code>). Likewise, a judge can&#x27;t register as a participant.", "note": "", "p": false}, {"id": "JG-3", "html": "Change a judge&#x27;s tracks so an existing assignment falls outside them. <b>Expected:</b> refused (<code>judge_has_assignments</code>).", "note": "", "p": false}, {"id": "JG-4", "html": "Remove a judge who has submitted reviews. <b>Expected:</b> refused (<code>judge_has_reviews</code>), pointing to &quot;exclude from results&quot;.", "note": "", "p": false}, {"id": "JG-5", "html": "Add a conflict of interest (judge ↔ team). <b>Expected:</b> the response lists affected assignments; the Assignments page marks them; auto-assign never pairs them (A-2 also covers this).", "note": "", "p": false}]}, {"name": "5. T2: judging engine › 5.3 Assignments (Manage → Assignments)", "cases": [{"id": "AS-1", "html": "Demo jam (submissions still open): Preview works, but <b>Commit is disabled</b> with an explanation.", "note": "", "p": false}, {"id": "AS-2", "html": "Sample Hack: Preview &quot;fill to 3 per project&quot;. <b>Expected:</b> the summary shows new assignments for the 8 projects that only have 2 reviews, load stats, and <b>1 connected group</b>.", "note": "", "p": false}, {"id": "AS-3", "html": "Preview &quot;simulate from scratch&quot;. <b>Expected:</b> judge load about 2–7 with lower spread, compared with the fixture&#x27;s own 1–11.", "note": "", "p": false}, {"id": "AS-4", "html": "Same seed twice → identical preview. A different seed → a different but equally valid plan.", "note": "", "p": false}, {"id": "AS-5", "html": "<b>Stale preview:</b> preview, then in another tab add a conflict or a judge, then Commit. <b>Expected:</b> 409 &quot;Preview again&quot;.", "note": "", "p": false}, {"id": "AS-6", "html": "Commit → a history row with algorithm, seed and count. Coverage shows 3 per project.", "note": "", "p": false}, {"id": "AS-7", "html": "Manual add: the judge picker greys out ineligible judges *with the reason* (already assigned / conflict / different track / recused).", "note": "", "p": false}, {"id": "AS-8", "html": "Reassign an unstarted assignment. Try to delete or reassign a <b>submitted</b> one → refused.", "note": "", "p": false}]}, {"name": "5. T2: judging engine › 5.4 Judge console (Spring Build Sprint as judge@dogfood.local)", "cases": [{"id": "JC-1", "html": "Judging dashboard: a greeting, a progress bar (3/7), a countdown to close, and groups To review / In progress / Submitted.", "note": "", "p": true}, {"id": "JC-2", "html": "Open a project: story on the left, sticky scoring panel on the right, weights shown per criterion.", "note": "", "p": false}, {"id": "JC-3", "html": "<b>Keyboard:</b> focus starts on the first *unscored* criterion. Digits score it (<code>0</code> = 10 on 1–10 rubrics), ↑/↓ move between criteria, and the composite updates live.", "note": "", "p": true}, {"id": "JC-4", "html": "Autosave: score two criteria, wait about a second → &quot;Saved&quot;. Close the tab and reopen → the draft is kept; the dashboard shows &quot;Draft saved&quot;.", "note": "", "p": false}, {"id": "JC-5", "html": "Submit with a criterion missing. <b>Expected:</b> refused, naming the missing criterion.", "note": "", "p": false}, {"id": "JC-6", "html": "Complete and &quot;Submit &amp; next&quot; → it jumps to the next *unscored* project; progress becomes 4/6.", "note": "", "p": false}, {"id": "JC-7", "html": "Revise a submitted review → allowed while judging is open; the audit log has <code>review.revised</code> with before/after.", "note": "", "p": false}, {"id": "JC-8", "html": "Recuse from a project with &quot;declare a conflict&quot;. <b>Expected:</b> it moves to Recused and the draft is deleted. Organizer → Judges shows the new conflict, and auto-assign never gives that team back.", "note": "", "p": false}, {"id": "JC-9", "html": "<b>Isolation (critical):</b> copy the assignment URL from judge A. Open it as judge B (another window) → <b>404</b>, not 403. Same through the API: <code>curl -H &quot;Cookie: sid=seed-judge-b&quot; localhost:8080/api/events/sample-hack-2026/judging/&lt;A&#x27;s id&gt;</code> → 404.", "note": "", "p": true}, {"id": "JC-10", "html": "Sample Hack judges (judging closed): everything is read-only, and trying to save via the API → <code>judging_closed</code>.", "note": "", "p": false}, {"id": "JC-11", "html": "An organizer or participant opening <code>/events/&lt;slug&gt;/judging</code> gets &quot;You&#x27;re not judging this event&quot;.", "note": "", "p": false}]}, {"name": "5. T2: judging engine › 5.5 Progress (Spring Build Sprint → Manage → Progress)", "cases": [{"id": "PR-1", "html": "Tiles show about 29/44 reviews, 3/8 judges finished, and <b>2 judges behind</b> (Eli: not started; Dana: behind).", "note": "", "p": true}, {"id": "PR-2", "html": "The chart&#x27;s submitted line sits against the dashed steady-pace line, with a &quot;now&quot; marker.", "note": "", "p": false}, {"id": "PR-3", "html": "Live: score a review as judge@dogfood.local in another window. Within 15 s the counts and chart update <b>without a reload</b>. The indicator says &quot;Live · updated Xs ago&quot;.", "note": "", "p": false}, {"id": "PR-4", "html": "Remind Eli → the email arrives in Mailpit with the count and deadline. Remind again → skipped (&quot;already reminded in the last 6 hours&quot;); the button shows &quot;Reminded …&quot;.", "note": "", "p": false}, {"id": "PR-5", "html": "Redistribute Eli → the preview lists each untouched project → new judge, <b>never</b> a judge with a conflict or a different track. Confirm → Eli has 0 assignments, and a &quot;Redistributed from Eli Navarro&quot; batch appears in Assignments history.", "note": "", "p": false}, {"id": "PR-6", "html": "Stale redistribution: preview for Dana, then as Dana (or via the DB) start a review, then confirm → 409, and her started work is untouched.", "note": "", "p": false}, {"id": "PR-7", "html": "&quot;Projects that need attention&quot; lists projects waiting on stragglers or under-assigned (e.g. the one Gus recused from).", "note": "", "p": false}, {"id": "PR-8", "html": "At phone width the judges table scrolls <b>inside</b> its card and the page doesn&#x27;t scroll sideways.", "note": "", "p": false}]}, {"name": "5. T2: judging engine › 5.6 Results and normalization (Manage → Results)", "cases": [{"id": "RS-1", "html": "Sample Hack opens on the <b>published</b> run. Tiles: 40 ranked, agreement ρ ≈ 0.96, noise ±0.70, 1 judge group.", "note": "", "p": true}, {"id": "RS-2", "html": "The table shows rank arrows vs raw, raw vs adjusted, an interval bar, likely rank (#1–18 for #1), top-k %, and flags (provisional ×8, duplicate for prj_41 at the bottom, unranked).", "note": "", "p": false}, {"id": "RS-3", "html": "Fixture sanity: #1 prj_34 Iron Switch; prj_10 Still Beacon at #6 (was #3, provisional).", "note": "", "p": false}, {"id": "RS-4", "html": "Judges tab: jdg_02 and jdg_15 generous, jdg_10 harsh, jdg_07 &quot;same score for everything&quot;.", "note": "", "p": false}, {"id": "RS-5", "html": "Exclude a judge: a reason is required (a short one is refused) → a live preview shows the rank changes; nothing is saved until &quot;Save as a run&quot;.", "note": "", "p": false}, {"id": "RS-6", "html": "Save a run → it appears under Saved runs with its fingerprint. Two saves with the same inputs have the <b>same fingerprint</b>.", "note": "", "p": false}, {"id": "RS-7", "html": "Spring Build Sprint (judging open): Publish is <b>locked</b> with an explanation.", "note": "", "p": true}, {"id": "RS-8", "html": "Stale run: save a run, then change a weight (RB-2) or revise a review → the run shows &quot;data changed since&quot; and Publish is refused (<code>stale_run</code>).", "note": "", "p": false}, {"id": "RS-9", "html": "Unpublish on Sample Hack → the public Results tab disappears. Publish again → it&#x27;s back. The audit log shows <code>results.unpublished</code> and <code>results.published</code>.", "note": "", "p": false}, {"id": "RS-10", "html": "Public results: podium with prize names, track chips re-rank within the track, and <code>?track=garbage</code> falls back to Overall. The page source/JSON contains <b>no</b> judge names, offsets or raw scores.", "note": "", "p": false}, {"id": "RS-11", "html": "&quot;Proof report&quot; downloads a Markdown file with the ranking table, judge leniency, the simulation tables and the integrity section.", "note": "", "p": false}, {"id": "RS-12", "html": "Immutability (optional, needs <code>psql</code>): <code>UPDATE &quot;ProjectResult&quot; SET rank = 1;</code> → the database raises &quot;immutable snapshot&quot;.", "note": "", "p": false}]}, {"name": "5. T2: judging engine › 5.7 Integrity (Manage → Integrity)", "cases": [{"id": "IN-1", "html": "Spring Build Sprint shows <b>exactly</b> the planted problems:", "note": "", "p": true}, {"id": "IN-2", "html": "Sample Hack shows jdg_04 opposite to the panel (r = −0.99), the jdg_04/prj_37 outlier, 4 comment mismatches (&quot;Docs are thin.&quot; on high scores, including jdg_15/prj_34), and jdg_07&#x27;s halo and flat scores. It shows <b>no</b> copy-paste flags, and &quot;Reviews with timing&quot; is 0%.", "note": "", "p": false}, {"id": "IN-3", "html": "&quot;Looks fine&quot; with an empty note → refused. With a note → it moves to &quot;Decided&quot; with your name and time. Reopen → back to Open. The audit log has <code>integrity.flag_resolved</code> and <code>integrity.flag_reopened</code>.", "note": "", "p": false}, {"id": "IN-4", "html": "&quot;Exclude judge…&quot; opens Results with the exclusion dialog already open for that judge.", "note": "", "p": false}, {"id": "IN-5", "html": "Judges and participants: <code>/api/events/&lt;slug&gt;/integrity</code> → 403. Judges never see flags anywhere in their console.", "note": "", "p": false}]}, {"name": "5. T2: judging engine › 5.8 Exports (Manage → Exports)", "cases": [{"id": "EX-1", "html": "Eight files with row counts. Sample Hack: participants 91, teams 40, projects 41, judges 30, assignments 126, reviews 378, results 41.", "note": "Updated: there are now 11 CSV files (comparisons.csv was added).", "p": true}, {"id": "EX-2", "html": "Open each file in Excel or LibreOffice: names with accents are correct (UTF-8 BOM), and comments containing commas stay in one cell.", "note": "", "p": false}, {"id": "EX-3", "html": "Formula injection: set a project title to <code>=HYPERLINK(&quot;<a href=\"http://x&quot;\" target=\"_blank\">http://x&quot;</a>,&quot;click&quot;)</code>, export projects.csv, open it in a spreadsheet → shown as text starting with <code>&#x27;</code>, <b>not</b> a link.", "note": "", "p": false}, {"id": "EX-4", "html": "results.csv says <code>published run &lt;id&gt;</code> when published, and <code>live (not published)</code> after unpublishing.", "note": "", "p": false}, {"id": "EX-5", "html": "Every download adds an <code>export.downloaded</code> row to audit.csv.", "note": "", "p": false}, {"id": "EX-6", "html": "As a participant or judge, <code>/api/events/sample-hack-2026/export/reviews.csv</code> → 403.", "note": "", "p": false}]}, {"name": "7. Cross-cutting", "cases": [{"id": "UX-1", "html": "<b>Themes::</b> go through every page in both light and dark. Watch for low-contrast text, white boxes in dark mode, and invisible chart lines.", "note": "", "p": false}, {"id": "UX-2", "html": "<b>Phone width (375–390 px)::</b> home, event hub, gallery, project page, editor, team, judge scoring, and all manage pages. The page must never scroll sideways; wide tables scroll inside their card.", "note": "", "p": false}, {"id": "UX-3", "html": "<b>Browsers::</b> Chrome, Firefox, Safari or Edge. Pay attention to the date inputs on Schedule and the countdown.", "note": "", "p": false}, {"id": "UX-4", "html": "<b>Keyboard only::</b> tab through login, register, editor and scoring. Focus rings are visible and Escape closes dialogs.", "note": "", "p": false}, {"id": "UX-5", "html": "<b>Empty states::</b> a new event with no tracks, prizes, projects or reviews shows helpful empty states, not errors or blank cards.", "note": "", "p": false}, {"id": "OFF-1", "html": "<b>Offline::</b> disconnect from the internet, then <code>docker compose down -v &amp;&amp; up -d --build</code> (with images already pulled). <b>Expected:</b> the stack starts and seeds; fonts load; email goes to Mailpit. There should be no requests to external hosts (DevTools → Network).", "note": "", "p": false}, {"id": "OFF-2", "html": "<b>Restart safety::</b> <code>docker compose restart api</code>. <b>Expected:</b> the seed is idempotent. No duplicate events or users; the published results and your decisions survive.", "note": "", "p": false}, {"id": "AUD-1", "html": "After a full run, <code>npm run audit:verify</code> → the chain is intact.", "note": "", "p": false}]}]}, {"title": "Plan 2: T3 + T4", "sections": [{"name": "3. Smoke test for the new features (20 min)", "cases": [{"id": "S2-1", "html": "As voter@dogfood.local: Spring Build Sprint → <b>Vote</b> tab. Projects are listed; pick 3, then <b>Save</b> → a receipt <code>DF-XXXXX-XXXXX</code> appears.", "note": "", "p": true}, {"id": "S2-2", "html": "Sample Hack → <b>People&#x27;s Choice</b> tab (logged out): podium, full list, a &quot;Did list position matter?&quot; chart, and a <code>ballots.json</code> download with its SHA-256.", "note": "", "p": true}, {"id": "S2-3", "html": "A project page in Spring Build Sprint: comments show with replies; post one (as the voter) → it appears.", "note": "", "p": false}, {"id": "S2-4", "html": "As organizer: Spring Build Sprint → Manage → <b>Vote review</b> shows a <b>high</b> severity incident (the Portly ring) and a <b>low</b> one (campus).", "note": "", "p": true}, {"id": "S2-5", "html": "<a href=\"http://localhost:8080/developers\" target=\"_blank\">http://localhost:8080/developers</a> loads, with &quot;OpenAPI 3.1.0&quot; and <b>135 operations</b>. The filter works (type <code>webhook</code>).", "note": "Updated: the API now has 162 documented operations.", "p": true}, {"id": "S2-6", "html": "User menu → <b>API tokens</b> → create a read-only token → copy it → its curl line returns your user.", "note": "", "p": false}, {"id": "S2-7", "html": "Manage → <b>Webhooks</b> (Spring Build Sprint): two endpoints. <a href=\"http://localhost:9000\" target=\"_blank\">http://localhost:9000</a> lists a <code>webhook.ping</code> marked <b>✓ valid</b>.", "note": "", "p": true}, {"id": "S2-8", "html": "Sample Hack → Manage → <b>Certificates</b> shows 121 current records. Open one → <b>View certificate</b> → a certificate with a QR code.", "note": "", "p": false}, {"id": "S2-9", "html": "Any <code>/verify/&lt;id&gt;</code> shows &quot;Authentic and current&quot; and <b>&quot;verified in your browser&quot;</b>.", "note": "", "p": true}, {"id": "S2-10", "html": "Manage → <b>Embed</b>: the live preview shows the gallery with 1st/2nd/3rd medals.", "note": "", "p": true}, {"id": "S2-11", "html": "Manage → Exports → <b>Full event (.json)</b> downloads a file of about 90 KB.", "note": "", "p": false}, {"id": "S2-12", "html": "New pages in dark mode and at 390 px width: no clipped text and no page-wide horizontal scroll.", "note": "", "p": false}]}, {"name": "4. T3: community › 4.1 Voting as a voter (Spring Build Sprint)", "cases": [{"id": "V-1", "html": "Logged out, open the Vote tab. <b>Expected:</b> it asks for your email, and there are no counts anywhere on the page.", "note": "", "p": false}, {"id": "V-2", "html": "Enter a new address (e.g. <code>tester1@example.org</code>) → &quot;Check your inbox&quot;. In Mailpit, open &quot;Your voting link…&quot; → the link lands on a page with a <b>Continue</b> button (so link scanners can&#x27;t burn it). Press it → you&#x27;re signed in on your ballot.", "note": "", "p": false}, {"id": "V-3", "html": "Open the same link again. <b>Expected:</b> refused (single use).", "note": "", "p": false}, {"id": "V-4", "html": "Try <code>someone@mailinator.com</code>. <b>Expected:</b> &quot;Throwaway email addresses can&#x27;t vote.&quot;", "note": "", "p": false}, {"id": "V-5", "html": "<b>Random order:</b> note the order of the first five projects. In another private window, sign in as a different new voter. <b>Expected:</b> a different order. Reload the first window: its order is unchanged (stable per voter).", "note": "", "p": true}, {"id": "V-6", "html": "Pick 4 when the limit is 3. <b>Expected:</b> &quot;You&#x27;ve used all 3 votes. Remove one to pick another.&quot; The vote dots show 3 used.", "note": "", "p": false}, {"id": "V-7", "html": "Save → receipt. Change a pick and save → <b>the same receipt</b>, updated time.", "note": "", "p": false}, {"id": "V-8", "html": "<b>One inbox, one ballot:</b> vote as <code>jane.doe@gmail.com</code>, then sign in as <code>janedoe+2@gmail.com</code> (the same Gmail inbox: dots and +tags are normalized). <b>Expected:</b> the second one can&#x27;t cast another ballot (it&#x27;s the same inbox).", "note": "", "p": false}, {"id": "V-9", "html": "Log in as a <b>team member</b> of a Spring Build Sprint project. <b>Expected:</b> your own project is marked and can&#x27;t be picked.", "note": "", "p": false}, {"id": "V-10", "html": "Log in as organizer (or judge@dogfood.local) → Vote tab. <b>Expected:</b> &quot;Staff can&#x27;t vote&quot;.", "note": "", "p": false}, {"id": "V-11", "html": "<b>Sealed counts:</b> as organizer, Manage → Voting shows turnout (voters and ballots) but <b>no per-project counts</b> while voting is open. Check <code>GET /api/events/spring-build-sprint/voting/results</code> → 404 <code>results_not_published</code>.", "note": "", "p": false}, {"id": "V-12", "html": "API: <code>PUT /api/events/spring-build-sprint/ballot</code> with a <b>write API token</b> (§5.1). <b>Expected:</b> 403 <code>session_required</code> (tokens can&#x27;t vote).", "note": "", "p": false}]}, {"name": "4. T3: community › 4.2 Voting modes and settings", "cases": [{"id": "VM-1", "html": "vote-lab → Manage → Voting: enable, opens = now, closes = tomorrow, mode <b>Ballot codes</b>, 2 votes → Save.", "note": "", "p": false}, {"id": "VM-2", "html": "Generate 5 codes labelled &quot;hall A&quot; → they&#x27;re shown once, with a CSV download (codes are stored hashed). Redeem one at <code>/events/vote-lab/vote?code=…</code> → ballot. Redeem the same code in another browser → &quot;already been used&quot;.", "note": "", "p": false}, {"id": "VM-3", "html": "Wrong code → &quot;isn&#x27;t valid&quot;. The audit log (Exports → audit.csv) has <code>vote.code_rejected</code>.", "note": "", "p": false}, {"id": "VM-4", "html": "Revoke the &quot;hall A&quot; batch → the unused codes stop working; the used one still has its ballot.", "note": "", "p": false}, {"id": "VM-5", "html": "Once a ballot exists, try switching the mode. <b>Expected:</b> 409 <code>voting_locked</code> (&quot;People have already voted…&quot;). Moving the dates still works.", "note": "", "p": false}, {"id": "VM-6", "html": "Setting <code>opens</code> before the submission deadline (on any event) → &quot;Voting opens once the submission deadline has passed&quot;.", "note": "", "p": false}, {"id": "VM-7", "html": "Verified-email mode with allowed domain <code>example.org</code>: an address at another domain → &quot;Voting is limited to email addresses from the organizers&#x27; allowed domains.&quot;", "note": "", "p": false}]}, {"name": "4. T3: community › 4.3 Anti-abuse review (Spring Build Sprint → Manage → Vote review)", "cases": [{"id": "AB-1", "html": "<b>High</b> severity incident: 12 ballots, all for *Portly*. Signals listed: shared /24, burst, fresh accounts, numbered addresses (<code>dev.hunter01..12</code>), surge, voted without viewing. Emails are masked (<code>d***1@outlook.com</code>).", "note": "", "p": false}, {"id": "AB-2", "html": "<b>Low</b> severity campus incident: 6 ballots, one network signal only. None of the 34 ordinary fans is flagged.", "note": "", "p": false}, {"id": "AB-3", "html": "Quarantine the ring with reason &quot;ring of throwaway accounts&quot;. <b>Expected:</b> the ballots are kept but marked quarantined; turnout &quot;counted&quot; drops by 12. Audited as <code>ballots.quarantined</code>.", "note": "", "p": false}, {"id": "AB-4", "html": "Restore one ballot with a reason → it counts again. Dismiss the campus incident with a note → it moves to Resolved; reopen it → back to open.", "note": "", "p": false}, {"id": "AB-5", "html": "Rate limit (optional, API): more than 30 ballot changes in an hour from one ballot → 429.", "note": "", "p": false}]}, {"name": "4. T3: community › 4.4 Comments (Spring Build Sprint project pages)", "cases": [{"id": "CM-1", "html": "Logged out: comments are readable, and the form says to log in.", "note": "", "p": false}, {"id": "CM-2", "html": "As voter: post a comment → it appears. Reply to it → indented. Try replying to a reply → there&#x27;s no reply button (one level only).", "note": "", "p": false}, {"id": "CM-3", "html": "Edit your comment → &quot;edited&quot;. The earlier text is in audit.csv (<code>comment.edited</code>, before/after). After 15 minutes, the Edit button disappears (optional).", "note": "", "p": false}, {"id": "CM-4", "html": "Post <code>&lt;script&gt;alert(1)&lt;/script&gt;</code> → shown as literal text, and nothing runs.", "note": "", "p": true}, {"id": "CM-5", "html": "Post the same text twice → &quot;You&#x27;ve already posted that comment&quot;. Post 6 comments within 10 minutes → the 6th is refused.", "note": "", "p": false}, {"id": "CM-6", "html": "A brand-new account (registered today) posts a link → refused (&quot;new accounts can&#x27;t post links&quot;). The voter (older account) can.", "note": "", "p": false}, {"id": "CM-7", "html": "As judge@dogfood.local (judging open) → the comment box says judges can comment after judging closes.", "note": "", "p": false}, {"id": "CM-8", "html": "Report someone else&#x27;s comment → &quot;reported&quot;. Reporting it again → &quot;already reported&quot;. Your own comment has no Report button.", "note": "", "p": false}, {"id": "CM-9", "html": "Delete your own comment → it&#x27;s gone; replies to it stay under a placeholder.", "note": "", "p": false}]}, {"name": "4. T3: community › 4.5 Moderation (Manage → Comments)", "cases": [{"id": "MO-1", "html": "The &quot;Reported&quot; tab shows the Portly spam (&quot;VOTE PORTLY!!!…&quot;) with 2 reports.", "note": "", "p": false}, {"id": "MO-2", "html": "Hide it with a reason → it disappears from the project page. Unhide → it&#x27;s back. Dismiss the reports → it leaves the queue.", "note": "", "p": false}, {"id": "MO-3", "html": "Auto-hide: have 3 accounts older than a day report one comment → it&#x27;s hidden automatically, pending review (<code>comment.auto_hidden</code> in the audit log). Reports from brand-new accounts don&#x27;t count.", "note": "", "p": false}, {"id": "MO-4", "html": "Comments mode <b>Read-only</b> → existing comments are shown and posting is refused. <b>Off</b> → no comments section at all.", "note": "", "p": false}]}, {"name": "4. T3: community › 4.6 People's Choice (Sample Hack 2026)", "cases": [{"id": "PC-1", "html": "The public page shows ranks, with <b>ties sharing a rank</b> (e.g. two projects at 5th). There&#x27;s a &quot;No votes&quot; line for projects with zero votes, and a stats row with voters, votes and <b>4 ballots set aside</b>.", "note": "", "p": false}, {"id": "PC-2", "html": "<b>Recount:</b> download <code>ballots.json</code>. Count the <code>picks</code> of ballots with <code>&quot;status&quot;: &quot;counted&quot;</code>. <b>Expected:</b> it matches the published counts exactly. The page&#x27;s SHA-256 matches <code>sha256sum</code> of the file (or the <code>X-Content-SHA256</code> header), and the page says &quot;today&#x27;s file matches it&quot;.", "note": "", "p": false}, {"id": "PC-3", "html": "<b>Receipt check:</b> log in as voter@dogfood.local and open <code>/events/sample-hack-2026/vote</code> → note your receipt. On People&#x27;s Choice → &quot;Check your ballot&quot; → paste it → &quot;counted&quot;, with your picks. A made-up receipt → &quot;not found&quot;. DevTools: the receipt goes in the request <b>body</b>, not the URL.", "note": "", "p": false}, {"id": "PC-4", "html": "&quot;Did list position matter?&quot; shows a chart and the verdict &quot;no sign of position bias&quot; (χ² below 13.28).", "note": "", "p": false}, {"id": "PC-5", "html": "As organizer: Manage → Voting → <b>Unpublish</b> → the public page shows &quot;not out yet&quot;. Quarantine a ballot → allowed. Publish again → the SHA-256 changes, and the public page matches it.", "note": "", "p": false}, {"id": "PC-6", "html": "While results are published, try to quarantine a ballot → 409 &quot;Unpublish them first&quot;.", "note": "", "p": false}, {"id": "PC-7", "html": "On Spring Build Sprint (voting open): Manage → Exports → <code>ballots.csv</code> is listed as unavailable (&quot;sealed until voting closes&quot;).", "note": "", "p": false}]}, {"name": "5. T4: platform › 5.1 API tokens (User menu → API tokens)", "cases": [{"id": "TK-1", "html": "Create a read-only token, &quot;CI export&quot;, 30 days. <b>Expected:</b> it&#x27;s shown once with Copy, and a curl line. Reload the page: the list shows only the prefix (<code>dfp_ab12cd…</code>), never the full token.", "note": "", "p": false}, {"id": "TK-2", "html": "<code>curl -H &quot;Authorization: Bearer &lt;token&gt;&quot; localhost:8080/api/auth/me</code> → your user. The response headers include <code>RateLimit-Limit: 600</code> and <code>RateLimit-Remaining</code>.", "note": "", "p": false}, {"id": "TK-3", "html": "Read token → <code>curl -X PATCH …/api/events/sample-hack-2026 -d &#x27;{&quot;tagline&quot;:&quot;x&quot;}&#x27; -H &quot;Content-Type: application/json&quot;</code> → <b>403 <code>insufficient_scope</code></b>.", "note": "", "p": false}, {"id": "TK-4", "html": "Create a read-and-write token → the same PATCH works. audit.csv shows the actor as <code>organizer@dogfood.local (API token &quot;…&quot;)</code>.", "note": "", "p": false}, {"id": "TK-5", "html": "<b>Role checks still apply:</b> a token created by the participant (priya1) → <code>GET /api/events/sample-hack-2026/progress</code> → 403. A judge&#x27;s token → another judge&#x27;s scores (<code>/judges/jdg_26/scores</code>) → 403.", "note": "", "p": false}, {"id": "TK-6", "html": "<b>Browser-only actions:</b> with a write token → <code>GET /api/auth/tokens</code>, <code>PUT …/ballot</code>, <code>POST …/comments</code> → all <b>403 <code>session_required</code></b>.", "note": "", "p": false}, {"id": "TK-7", "html": "Revoke the token → the next request → <b>401 <code>invalid_token</code></b> (&quot;revoked&quot;). A made-up <code>dfp_…</code> → 401. The list shows the token as revoked.", "note": "", "p": false}, {"id": "TK-8", "html": "Old-style session bearer still works (the checker uses it): <code>curl -H &quot;Authorization: Bearer seed-organizer&quot; …/api/auth/me</code> → organizer.", "note": "", "p": false}, {"id": "TK-9", "html": "The seeded token <code>dfp_demo-organizer-read-only</code> can read <code>/api/events/sample-hack-2026/export/results.csv</code>.", "note": "", "p": false}]}, {"name": "5. T4: platform › 5.2 OpenAPI and the API reference", "cases": [{"id": "OA-1", "html": "<code>GET /api/openapi.json</code> → <code>&quot;openapi&quot;: &quot;3.1.0&quot;</code>, and the operation count matches the badge on /developers.", "note": "", "p": false}, {"id": "OA-2", "html": "/developers: the Guide sections (Authentication, Rate limits, Conventions, Webhooks) render. Open &quot;PATCH /api/events/{slug}/projects/{projectId}&quot;: a request-body table with constraints (e.g. <code>title</code> 1–120 chars), an access badge, and a curl example.", "note": "", "p": false}, {"id": "OA-3", "html": "The link <code>/developers#postAuthTokens</code> opens that operation directly. Browser-only operations show a &quot;browser only&quot; pill.", "note": "", "p": false}, {"id": "OA-4", "html": "Paste <code>docs/openapi.json</code> into any OpenAPI 3.1 validator or viewer (optional, needs internet) → valid.", "note": "", "p": false}, {"id": "OA-5", "html": "The &quot;Webhook events&quot; section lists every event type, each with its <code>data</code> fields, plus the Node verification snippet.", "note": "", "p": false}]}, {"name": "5. T4: platform › 5.3 Webhooks (Spring Build Sprint → Manage → Webhooks)", "cases": [{"id": "WH-1", "html": "Two endpoints: &quot;Team chat relay&quot; (all events, active) and &quot;CRM sync (down on purpose)&quot; (2 types), with delivered, retrying and failed counts.", "note": "", "p": false}, {"id": "WH-2", "html": "Open the <b>down</b> endpoint: its ping is <b>Retrying</b>, with 503 attempts and a &quot;next try&quot; time. Expand it: every attempt shows its status, duration and response (&quot;down for maintenance&quot;). The row refreshes live.", "note": "", "p": false}, {"id": "WH-3", "html": "Open the healthy endpoint → <b>Send test</b> → within about 3 s it shows Delivered 204. <a href=\"http://localhost:9000\" target=\"_blank\">http://localhost:9000</a> shows it <b>✓ valid</b>.", "note": "", "p": false}, {"id": "WH-4", "html": "<b>A real event:</b> edit the event tagline (Details &amp; branding) → an <code>event.updated</code> delivery arrives at the receiver, ✓ valid, with <code>data.changed: [&quot;tagline&quot;]</code>.", "note": "", "p": false}, {"id": "WH-5", "html": "<b>Filtering:</b> the CRM endpoint (subscribed to <code>project.submitted</code> and <code>results.published</code>) gets <b>no</b> <code>event.updated</code>.", "note": "", "p": false}, {"id": "WH-6", "html": "<b>No ballot events:</b> cast or change a ballot as a voter → <b>nothing</b> arrives at the receiver, even for the all-events endpoint.", "note": "", "p": false}, {"id": "WH-7", "html": "Add an endpoint <code>http://169.254.169.254/latest/meta-data</code> → refused (&quot;private or internal addresses&quot;). The same for <code>http://localhost:4000</code>, <code>http://10.0.0.5</code> and <code>http://user:pw@example.org</code>.", "note": "", "p": false}, {"id": "WH-8", "html": "Add <code>https://example.org/hook</code> → the secret <code>whsec_…</code> is shown once, plus a test delivery. Offline, that delivery fails with a DNS error and retries; that&#x27;s expected.", "note": "", "p": false}, {"id": "WH-9", "html": "<b>Rotate secret</b> on the healthy endpoint → a new secret is shown, and a banner says &quot;old secret valid until …&quot;. Send test → the receiver still shows ✓ valid (it knows only the old secret, and both signatures are sent).", "note": "", "p": false}, {"id": "WH-10", "html": "Expand a delivered item → <b>Redeliver</b> → a new row with the <b>same message id</b>, marked &quot;redelivery&quot;. The receiver shows &quot;✓ valid (duplicate id)&quot;.", "note": "", "p": false}, {"id": "WH-11", "html": "<b>Switch off</b> → Send test is disabled. Change the tagline → no delivery is queued. Switch on → works again.", "note": "", "p": false}, {"id": "WH-12", "html": "As a judge or participant: <code>GET /api/events/spring-build-sprint/webhooks</code> → 403.", "note": "", "p": false}, {"id": "WH-13", "html": "The audit log has <code>webhook.created</code>, <code>webhook.secret_rotated</code>, <code>webhook.test_sent</code> and <code>webhook.redelivered</code>, and <b>never contains a secret</b>.", "note": "", "p": false}]}, {"name": "5. T4: platform › 5.4 Signed records and certificates (Sample Hack 2026)", "cases": [{"id": "RC-1", "html": "Manage → Certificates: &quot;121 current records&quot;, 30 judges and 91 participants. There&#x27;s no row for a judge with zero submitted reviews.", "note": "", "p": false}, {"id": "RC-2", "html": "<b>Re-issue changed records</b> → &quot;Everything is up to date (121 unchanged)&quot;.", "note": "", "p": false}, {"id": "RC-3", "html": "Open a 1st-place participant&#x27;s certificate: name, team, project, &quot;1st of 40 · judged results&quot;, dates, &quot;Digitally signed&quot;, key id, verify URL, QR code. <b>Print</b> → one A4 landscape page with no site header or footer. It looks identical in dark mode.", "note": "", "p": false}, {"id": "RC-4", "html": "Scan the QR (phone on the same machine, or copy the URL) → the verify page.", "note": "", "p": false}, {"id": "RC-5", "html": "A judge&#x27;s verify page: review count, tracks, a <code>sha256:…</code> <b>reviews commitment</b>, and <b>no scores</b> anywhere (check &quot;The exact signed text&quot;).", "note": "", "p": false}, {"id": "RC-6", "html": "<b>Verify it yourself:</b> <code>node tools/verify-record.mjs <a href=\"http://localhost:8080/verify/&lt;id&gt;\" target=\"_blank\">http://localhost:8080/verify/&lt;id&gt;</a></code> → ✓ signature valid. Add <code>--openssl out</code>, then run the printed <code>openssl pkeyutl -verify …</code> → &quot;Signature Verified Successfully&quot;.", "note": "", "p": false}, {"id": "RC-7", "html": "<b>Forgery:</b> download &quot;Signed record (.json)&quot;, change the name or placement in a text editor, then run the tool on the file → <b>✗ signature INVALID</b>, exit code 1.", "note": "", "p": false}, {"id": "RC-8", "html": "<b>Revoke</b> a record with a reason → its verify page shows &quot;Authentic, but revoked&quot; with the reason, and the certificate shows a <b>REVOKED</b> watermark. Re-issue does *not* bring it back.", "note": "", "p": false}, {"id": "RC-9", "html": "<b>Supersede:</b> rename a team (or unpublish and republish results) → Re-issue → &quot;Signed 1…, replacing 1&quot;. The old verify link shows &quot;Authentic, but superseded&quot; and links to the new one.", "note": "", "p": false}, {"id": "RC-10", "html": "As a participant: User menu → <b>My certificates</b> lists their record with Certificate and Verification link.", "note": "", "p": false}, {"id": "RC-11", "html": "Spring Build Sprint (judging open) → Certificates → &quot;Available once judging closes&quot;, with the button disabled. The API returns 409 <code>judging_not_closed</code>.", "note": "", "p": false}, {"id": "RC-12", "html": "<b>Tamper-proof (optional, DB):</b> <code>docker exec -it dogfood-db-1 psql -U dogfood -d dogfood -c &quot;UPDATE \\&quot;SignedRecord\\&quot; SET statement=&#x27;{}&#x27; &quot;</code> → ERROR &quot;a signed record&#x27;s statement cannot change&quot;. <code>DELETE</code> → &quot;cannot be deleted&quot;.", "note": "", "p": false}, {"id": "RC-13", "html": "<code>GET /api/records/keys</code> lists the current key (<code>retiredAt: null</code>). The private key is <b>not</b> in the database; it&#x27;s at <code>/data/keys/signing-key.pem</code> in the api container, on the <code>keys</code> volume.", "note": "", "p": false}]}, {"name": "5. T4: platform › 5.5 Embeddable gallery", "cases": [{"id": "EM-1", "html": "Manage → Embed: change the theme, track, search and medals options → the preview and the snippet update. Toggle script vs iframe code. Copy works.", "note": "", "p": false}, {"id": "EM-2", "html": "<b>Third-party page:</b> save this as <code>host.html</code> somewhere and serve it (<code>python -m http.server 5500</code> in that folder):", "note": "", "p": false}, {"id": "EM-3", "html": "<code>data-theme=&quot;dark&quot;</code> → dark gallery on a light host page.", "note": "", "p": false}, {"id": "EM-4", "html": "<b>Framing policy:</b> <code>curl -I localhost:8080/embed/sample-hack-2026</code> → <code>frame-ancestors *</code>. <code>curl -I localhost:8080/events/sample-hack-2026</code> → <code>X-Frame-Options: DENY</code> and <code>frame-ancestors &#x27;none&#x27;</code>. In host.html, add <code>&lt;iframe src=&quot;<a href=\"http://localhost:8080/events/sample-hack-2026&quot;&gt;\" target=\"_blank\">http://localhost:8080/events/sample-hack-2026&quot;&gt;</a></code> → the browser refuses to display it.", "note": "", "p": false}, {"id": "EM-5", "html": "<b>Anonymous:</b> while logged in as organizer, the embed shows only submitted projects, the same as logged out (no drafts, no user menu).", "note": "", "p": false}, {"id": "EM-6", "html": "A non-existent slug → <code>/embed/nope</code> → a 404 page, not a crash.", "note": "", "p": false}]}, {"name": "5. T4: platform › 5.6 Bulk export and import", "cases": [{"id": "IO-1", "html": "Manage → Exports → <b>Full event (.json)</b>. Open the file: <code>&quot;format&quot;: &quot;dogfood-event/v1&quot;</code>, 41 projects, 30 judges, people as emails, reviews with scores, and <b>no</b> password hashes, ballots or comments.", "note": "", "p": false}, {"id": "IO-2", "html": "As admin: Import an event → choose that file, slug <code>copy-1</code> → <b>Check the file</b>. <b>Expected:</b> the counts (41 projects, 126 reviews, 0 new accounts, …) and &quot;ran the real import and then rolled it back&quot;. Nothing exists yet at <code>/events/copy-1</code> (404).", "note": "", "p": false}, {"id": "IO-3", "html": "<b>Import</b> → &quot;Imported&quot;, with a link to the organizer console. You are its organizer. Its gallery has 40 projects; the prj_41 duplicate is flagged, not shown.", "note": "", "p": false}, {"id": "IO-4", "html": "<b>Round trip:</b> copy-1 → Manage → Results → compute a run. <b>Expected:</b> the same ranking as Sample Hack&#x27;s published results (same order and scores; tied projects share a rank).", "note": "", "p": false}, {"id": "IO-5", "html": "Import the same file again with no slug → &quot;An event with the slug … already exists&quot;. Slug <code>import</code> → &quot;reserved&quot;.", "note": "", "p": false}, {"id": "IO-6", "html": "<b>Broken file:</b> edit the export: change one project&#x27;s <code>team</code> to <code>&quot;nope&quot;</code>, duplicate a project <code>ref</code>, and set a score to 99 → Check. <b>Expected:</b> <b>all</b> the problems are listed at once, and nothing is imported.", "note": "", "p": false}, {"id": "IO-7", "html": "A random JSON (<code>{&quot;hello&quot;:1}</code>) → &quot;Expected a dogfood-event/v1 file … or a DOGFOOD fixtures.json&quot;. A non-JSON file → &quot;isn&#x27;t valid JSON&quot;.", "note": "", "p": false}, {"id": "IO-8", "html": "Import <code>data/fixtures.json</code> (slug <code>fx-1</code>) → works (source &quot;fixtures&quot;), with the same counts as the seeded Sample Hack.", "note": "", "p": false}, {"id": "IO-9", "html": "As organizer (not admin): <code>/events/import</code> → &quot;Only admins can import events&quot;. The API returns 403.", "note": "", "p": false}, {"id": "IO-10", "html": "Existing people keep their names and passwords: priya1@example.org can still log in with <code>dogfood2026</code> and now also sees copy-1 in the user menu.", "note": "", "p": false}]}, {"name": "7. Cross-cutting", "cases": [{"id": "X-1", "html": "<b>Light, dark and 390 px</b> on every new page: Vote, People&#x27;s Choice, comment threads, Manage → Voting / Vote review / Comments / Webhooks (list and detail) / Certificates / Embed, Account → API tokens / My certificates, /developers, /verify, /certificates, /events/import. No clipped text; tables scroll inside their card.", "note": "", "p": false}, {"id": "X-2", "html": "<b>Audit log</b> (Exports → audit.csv) has entries for: <code>ballot.cast</code>, <code>ballots.quarantined</code>, <code>comment.edited</code>, <code>comment.hidden</code>, <code>voting.results_published</code>, <code>api_token.created</code>, <code>api_token.revoked</code>, <code>webhook.*</code>, <code>records.issued</code>, <code>record.revoked</code>, <code>event.imported</code>, <code>export.downloaded</code>. Then <code>npm run audit:verify</code> → intact.", "note": "", "p": false}, {"id": "X-3", "html": "<b>Offline:</b> disconnect the network and restart the stack. Everything in §3 still works, except external webhook URLs (expected: DNS failures that retry).", "note": "", "p": false}, {"id": "X-4", "html": "<b>Restart safety:</b> <code>docker compose restart api</code>. The same signing key id appears in the log, no duplicate records or webhooks are created, and demo logins still work.", "note": "", "p": false}, {"id": "X-5", "html": "<code>SEED_DEMO=false</code> (set it in docker-compose, then <code>up -d api</code>). The log says demo sessions, API tokens and webhooks were removed; <code>seed-organizer</code> and <code>dfp_demo-…</code> now return 401 or visitor.", "note": "", "p": false}]}, {"name": "7b. Head-to-head (pairwise) judging", "cases": [{"id": "PW-1", "html": "As the organizer, open Manage → <b>Head to head</b>. You should see:", "note": "", "p": true}, {"id": "PW-2", "html": "<b>comparisons.csv</b> downloads: one line per comparison plus the header, one <code>winner_project_id</code> per decided row. It&#x27;s also listed on the Exports page.", "note": "", "p": false}, {"id": "PW-3", "html": "Log in as <code>judge@dogfood.local</code> and open Judging. The <b>Head to head</b> card is shown; open it.", "note": "", "p": true}, {"id": "PW-4", "html": "Keep going until &quot;You&#x27;ve compared every pair&quot;. The same pair is never shown twice.", "note": "", "p": false}, {"id": "PW-5", "html": "In Manage → Head to head, click <b>Turn off</b>. The judge&#x27;s card disappears, and the compare page says it&#x27;s off. Turn it back on.", "note": "", "p": false}, {"id": "PW-6", "html": "Probe the API as <code>seed-judge-b</code>: <code>POST /api/events/spring-build-sprint/judging/pairwise</code> with two projects that aren&#x27;t theirs should return <b>404</b>. <code>GET /api/events/spring-build-sprint/pairwise</code> should return <b>403</b>, because judges never see the panel&#x27;s view.", "note": "", "p": false}, {"id": "PW-7", "html": "As the organizer, <code>POST …/judging/pairwise</code> should return <b>403</b>, because organizers can&#x27;t compare on a judge&#x27;s behalf.", "note": "", "p": false}]}]}, {"title": "Plan 3: added since", "sections": [{"name": "Product polish and hardening", "cases": [{"id": "N-1", "html": "<b>Host a hackathon</b> (any signed-in user): 5 steps. A preset fills all five dates; wrong date order is flagged on step 2; the review step lists everything. <b>Create</b> opens the organizer console with the tracks, prizes and rubric already there.", "note": "", "p": true}, {"id": "N-2", "html": "The new event is a <b>private draft</b>: as another user its URL is a 404. After <b>Publish</b> on the banner, it&#x27;s listed on Hackathons.", "note": "", "p": true}, {"id": "N-3", "html": "<code>/u/priya</code>: photo or initials, headline, skills, links, hackathon history with placement, and her certificate. <b>No email address</b> anywhere on the page.", "note": "", "p": true}, {"id": "N-4", "html": "As organizer, the <b>bell</b> shows unread alerts (a judge falling behind, suspicious voting). The notifications page: filter unread, mark all read, the count goes to 0.", "note": "", "p": true}, {"id": "N-5", "html": "Demo Jam → <b>Find a team</b>: teams with room and people looking; search by skill narrows the list.", "note": "", "p": false}, {"id": "N-6", "html": "As organizer, post an <b>Update</b> on Demo Jam with notify on. It appears on the Updates tab and in participants&#x27; bells.", "note": "", "p": false}, {"id": "N-7", "html": "Manage → Webhooks: the Slack/Discord/Custom tiles; <b>Test</b>, <b>Pause/Resume</b> and <b>Delivery log</b> work inline.", "note": "", "p": false}, {"id": "N-8", "html": "<b>Dashboard</b> is role-aware: an organizer sees Organizing tiles with progress; Priya sees Building and <b>Open to join</b>.", "note": "", "p": true}, {"id": "N-9", "html": "Mobile (390 px): the event tabs scroll and the active tab stays in view; on a sub-tab the status card sits under the content.", "note": "", "p": false}, {"id": "N-10", "html": "<b>View switcher:</b> as <code>organizer@dogfood.local</code>, the header shows <b>Organizer</b> (Participant / Organizer). Organizer view: only Organizing tiles and organizer deadlines. Participant view: no Manage tab on events. Switching to Organizer while on an event opens its Manage console. Priya (one role) sees no switcher.", "note": "", "p": true}, {"id": "N-11", "html": "<b>Already signed in:</b> open <code>/login</code> or <code>/register</code> while signed in → &quot;You&#x27;re already signed in&quot; with <b>Continue</b> and <b>Sign out and use another account</b> (which shows the login form).", "note": "", "p": true}, {"id": "N-12", "html": "<b>Verify page for non-developers:</b> <code>/verify/&lt;id&gt;</code> explains &quot;How do we know this is real?&quot; in three plain steps, has <b>Copy link to share</b>, and keeps the commands, key and signed text under a collapsed <b>For developers</b> section.", "note": "", "p": true}, {"id": "SEC-1", "html": "<b>Login throttling:</b> 10 wrong passwords for one account, then the 11th attempt (even with the right password) → 429 &quot;Too many failed sign-ins&quot;. Another account still signs in.", "note": "", "p": true}, {"id": "SEC-2", "html": "<b>No account takeover:</b> register with the email of a judge who was invited but hasn&#x27;t set a password → &quot;We&#x27;ve emailed a link to set your password&quot;; you are <b>not</b> signed in.", "note": "", "p": true}, {"id": "SEC-3", "html": "<b>Bare embed:</b> signed in as organizer, view source of <code>/embed/sample-hack-2026</code>: no site header and no user name.", "note": "", "p": true}, {"id": "SEC-4", "html": "<b>Forged IP ignored:</b> a request with <code>X-Forwarded-For: 6.6.6.6</code> is recorded in the audit log with the real address, not 6.6.6.6.", "note": "", "p": false}]}]}];
const TOTAL = 251;
const KEY = "dogfood-test-checklist-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const STATUSES = [["pass", "Pass"], ["fail", "Fail"], ["skip", "Skip"], ["blocked", "Blocked"]];
let filter = "all";

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  for (const g of GROUPS) {
    const h = document.createElement("h2"); h.textContent = g.title; root.appendChild(h);
    for (const s of g.sections) {
      const d = document.createElement("details"); d.open = true;
      d.innerHTML = `<summary>${s.name}<span class="mini"></span></summary>`;
      for (const c of s.cases) {
        const row = document.createElement("div");
        row.className = "case"; row.id = "case-" + c.id; row.dataset.id = c.id; row.dataset.p = c.p ? "1" : "";
        row.innerHTML = `<div class="id">${c.p ? '<span class="star" title="Priority">★</span> ' : ""}${c.id}</div>
          <div class="text">${c.html}${c.note ? `<div class="update">${c.note}</div>` : ""}</div>
          <div class="controls">${STATUSES.map(([k, l]) => `<button class="st" data-s="${k}" aria-label="${l} ${c.id}" aria-pressed="false">${l}</button>`).join("")}
            <input class="note" aria-label="Note for ${c.id}" placeholder="Note (what you saw)">
            <span class="stamp"></span></div>`;
        row.querySelectorAll(".st").forEach((b) => b.addEventListener("click", () => {
          const cur = state[c.id] || {};
          cur.status = cur.status === b.dataset.s ? "" : b.dataset.s;
          cur.at = new Date().toISOString();
          state[c.id] = cur; save(); paint(row); summarize();
        }));
        const note = row.querySelector(".note");
        note.addEventListener("input", () => { state[c.id] = { ...(state[c.id] || {}), note: note.value }; save(); });
        d.appendChild(row); paint(row);
      }
      root.appendChild(d);
    }
  }
  applyFilter(); summarize();
}

function paint(row) {
  const s = state[row.dataset.id] || {};
  row.classList.remove("pass", "fail", "skip", "blocked");
  if (s.status) row.classList.add(s.status);
  row.querySelectorAll(".st").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === s.status)));
  row.querySelector(".note").value = s.note || "";
  row.querySelector(".stamp").textContent = s.status && s.at ? new Date(s.at).toISOString().slice(11, 16) + " UTC" : "";
}

function applyFilter() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll(".case").forEach((row) => {
    const st = (state[row.dataset.id] || {}).status || "";
    let show = filter === "all" || (filter === "priority" && row.dataset.p) || (filter === "todo" && !st) || (filter === "fail" && st === "fail");
    if (show && q) show = row.textContent.toLowerCase().includes(q);
    row.classList.toggle("hidden", !show);
  });
  document.querySelectorAll("details").forEach((d) => d.classList.toggle("hidden", !d.querySelector(".case:not(.hidden)")));
}

function summarize() {
  const all = [...document.querySelectorAll(".case")];
  const count = (k) => all.filter((r) => (state[r.dataset.id] || {}).status === k).length;
  const n = { pass: count("pass"), fail: count("fail"), skip: count("skip"), blocked: count("blocked") };
  const run = n.pass + n.fail + n.skip + n.blocked;
  const pr = all.filter((r) => r.dataset.p);
  const prRun = pr.filter((r) => (state[r.dataset.id] || {}).status).length;
  document.getElementById("counts").innerHTML =
    `<span><b>${run}</b> of ${TOTAL} run</span><span>★ priority <b>${prRun}</b> of ${pr.length}</span>` +
    `<span style="color:var(--pass)">pass <b>${n.pass}</b></span><span style="color:var(--fail)">fail <b>${n.fail}</b></span>` +
    `<span style="color:var(--skip)">skip <b>${n.skip}</b></span><span style="color:var(--block)">blocked <b>${n.blocked}</b></span>`;
  document.getElementById("bar").innerHTML = ["pass", "fail", "skip", "blocked"].map((k) => `<span style="width:${(n[k] / TOTAL) * 100}%;background:var(--${k === "blocked" ? "block" : k})"></span>`).join("");
  document.querySelectorAll("details").forEach((d) => {
    const rows = [...d.querySelectorAll(".case")];
    const done = rows.filter((r) => (state[r.dataset.id] || {}).status).length;
    d.querySelector(".mini").textContent = `${done}/${rows.length}`;
  });
}

document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
  filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", String(x === c)));
  applyFilter();
}));
document.getElementById("q").addEventListener("input", applyFilter);

function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
}
document.getElementById("exportJson").addEventListener("click", () => download("test-results.json", JSON.stringify(state, null, 2), "application/json"));
document.getElementById("exportMd").addEventListener("click", () => {
  const lines = ["# Dogfood test results", "", `Exported ${new Date().toISOString()}`, ""];
  for (const g of GROUPS) for (const s of g.sections) {
    const run = s.cases.filter((c) => (state[c.id] || {}).status);
    if (!run.length) continue;
    lines.push(`## ${g.title}: ${s.name}`, "");
    for (const c of run) { const r = state[c.id]; lines.push(`- **${c.id}** ${r.status.toUpperCase()}${r.note ? ` — ${r.note}` : ""}`); }
    lines.push("");
  }
  download("test-results.md", lines.join("\n"), "text/markdown");
});
document.getElementById("importJson").addEventListener("click", () => {
  const input = document.createElement("input"); input.type = "file"; input.accept = "application/json";
  input.onchange = async () => { try { state = JSON.parse(await input.files[0].text()); save(); render(); } catch { alert("That file isn't a checklist export."); } };
  input.click();
});
document.getElementById("reset").addEventListener("click", () => { if (confirm("Clear every result?")) { state = {}; save(); render(); } });
render();
</script>
</body>
